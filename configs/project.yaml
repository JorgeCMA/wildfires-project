data:
  raw: data/raw
  processed: data/processed

firms:
  source: NASA FIRMS
  format: csv
  countries:
    - Spain
  years:
    - 2023
    - 2024
  sensors:
    - modis
    - viirs_snpp
    - viirs_noaa20
  sensor_folders:
    modis: "MODIS"
    viirs_snpp: "VIIRS/VIIRS S-NPP"
    viirs_noaa20: "VIIRS/VIIRS NOAA-20"

clcplus:
  source: Copernicus Land Cover
  format: geotiff
  resolution: 10
  validity_period: "2023-2025"
  countries:
    - Spain
  neighborhood:
    enabled: true
    rings: [1, 2]

openmeteo:
  source: Open-Meteo
  base_url: "https://archive-api.open-meteo.com/v1/archive"
  # Número de filas (detecciones) que se envían en cada consulta por lotes.
  # Fácil de editar para probar hasta dónde aguanta la API.
  # Vive fuera de batch_query para que NO se envíe como parámetro HTTP.
  batch_rows: 500
  # Pausa proactiva (segundos) entre lotes correctos en
  # run_weather_enrichment. 0 = solo reactiva (solo espera tras un 429).
  # 450 medido por scripts/probe_openmeteo_weight.py (peso ~700/lote de
  # 500 filas: manda el límite horario, 3600/8 = 450 s; el/minuto admite 1).
  batch_interval_seconds: 450
  # Margen añadido sobre la frontera UTC (minuto/hora) antes de reintentar
  # tras un 429: el contador del servidor se limpia en la frontera, no la
  # petición, así que damos un margen para no caer en la ventana vieja.
  minutely_buffer_seconds: 5
  hourly_buffer_seconds: 10
  # Espera fija tras "Too many concurrent requests" (segundos).
  concurrent_backoff_seconds: 5
  # Reintentos máximos seguidos del mismo límite (sin lote correcto
  # intercalado) antes de parar limpio en vez de buclear para siempre.
  max_consecutive_waits: 3
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - wind_speed_10m
    - wind_direction_10m
    - precipitation
    - shortwave_radiation
  # Opciones fijas de la consulta por lotes multi-ubicación (SDK openmeteo-requests).
  # Una sola petición devuelve una respuesta por cada par lat/lon.
  # Coordenadas y fechas salen de las filas del merged (3 primeras filas, con
  # acq_date como start/end): tests/test_openmeteo_requests.py
  batch_query:
    models: "best_match"
    # GMT (UTC): las horas de FIRMS (acq_date/acq_time) están en UTC, así que
    # el clima tiene que estarlo también. Es además el valor por defecto de la
    # API. Nunca "auto": devuelve offsets incorrectos (7200 para Madrid en
    # enero) y desplaza la ventana un hora.
    timezone: "GMT"
    hourly:
      - temperature_2m
      - precipitation
      - surface_pressure
      - relative_humidity_2m
      - wind_speed_10m
      - wind_direction_10m
      - wind_gusts_10m
      - rain
      - et0_fao_evapotranspiration
      - shortwave_radiation
      - boundary_layer_height
      - is_day
      - vapour_pressure_deficit
      - soil_moisture_0_to_7cm
      - soil_moisture_7_to_28cm

# Presupuestos por comunidad autónoma (datos en data/raw/ccaa/).
# Regional budgets (prevention + extinction) from data/raw/ccaa/.
ccaa:
  # Relativo a la raíz del proyecto (PROJECT_ROOT). / Project-root-relative.
  path: "data/raw/ccaa/Datos_CCAA_Presupuesto - Datos y Variables Model.csv"
  # Años previos que se suman por fila en `add_ccaa_budget_sums`:
  # prevención del año de la fila + suma de los N anteriores;
  # extinción SOLO de los N anteriores (el año en curso gasta durante el
  # año → incluirlo filtraría información desconocida en el momento del
  # fuego). N=3 → prev3 suma [año-3 .. año-1].
  # Años fuera del rango del fichero (2020-2025) no aportan nada;
  # ventana sin ningún año disponible → NaN (nunca 0).
  budget_lookback_years: 3
  # Límites de las Comunidades Autónomas (GeoJSON subido por el equipo).
  # CCAA boundaries (team-provided GeoJSON). Relativo a PROJECT_ROOT;
  # un valor absoluto también vale (Path / absoluto → absoluto).
  boundaries_path: "data/raw/ccaa/spain-communities.geojson"
  # Campo del GeoJSON con el nombre de la región. Sus valores se traducen a
  # los nombres EXACTOS del CSV de presupuestos con REGION_NAME_MAP
  # (geo/regions.py), p. ej. "Castilla-Leon" → "Castilla y León".
  boundaries_name_field: "name"
  # Respaldo en metros para puntos sin polígono que los contenga
  # (costa / frontera PT-FR): sjoin_nearest con esta distancia máxima.
  # Más lejos → ccaa NaN (y luego sumas NaN). Sin respaldo: 0.
  nearest_max_distance_m: 2000

# PCA de variables meteorológicas (notebook 02, celda PCA).
# Weather-variables PCA (notebook 02, PCA cell).
# Fracción de varianza acumulada objetivo para elegir el número de
# componentes (regla 80–90% + scree plot). La lee `load_target_variance()`
# en `src/wildfire/processing/pca_weather.py`; `fit_weather_pca` conserva
# los primeros k componentes con varianza acumulada >= este valor.
pca:
  target_variance: 0.90

# Aprendizaje no supervisado (bloque 03, ver planning/plan_unsupervised_implementation.md).
# Unsupervised learning (block 03, see planning/plan_unsupervised_implementation.md).
unsupervised:
  # Separación mínima de severidad entre grupos para aceptar una tipología
  # (§7B del plan): |δ de Cliff| máxima por pares sobre `frp`, y la candidata
  # tiene que superar además a los controles triviales (mes, CCAA).
  # Anclado en 03e (2026-10-16, base 23.142): mejor control CCAA = 0,699,
  # listón = primer paso de 0,05 estrictamente por encima = 0,70.
  # Anchored in 03e (2026-10-16, 23,142 base): best control CCAA = 0.699,
  # bar = first 0.05 step strictly above = 0.70.
  min_cliff_delta: 0.70

output:
  merged: data/processed/merged
  enriched: data/processed/enriched
  predictions: data/processed/predictions
  processed: data/processed
  # Días de fondo (negativos) del modelo supervisado de ocurrencia.
  # Background days (negatives) for the supervised occurrence model: el
  # parcial lo va rellenando el equipo por lotes; el terminado se publica al
  # completarse. El cargador prefiere el terminado y cae en el parcial.
  background_weather_partial: data/processed/synthetic/firms_spain_background_weather_partial.csv
  background_weather: data/processed/synthetic/firms_spain_background_weather.csv
  # Días de fondo enriquecidos (negativos) del modelo de ocurrencia, con clave
  # `background_id`. Lo construye el equipo (mismo esquema "everyday" que los
  # positivos); el lado de modelado solo lo consume.
  # Enriched background days (negatives) for the occurrence model, key
  # `background_id`, built by the team with the same everyday schema.
  background_days: data/processed/expanded/background_days.csv

paths:
  notebooks: notebooks
  scripts: scripts
  configs: configs
  confidence_thresholds: configs/confidence_thresholds.yaml

# Columnas que se eliminan al producir el dataframe de modelado.
# Modeling columns: dropped when producing the modeling dataframe.
modeling:
  # Blocklist (nombres exactos de columna). Los nombres ausentes se ignoran,
  # así la misma lista vale antes del dedup (sin `dupe_flag`) y después.
  drop_columns:
    - track
    - satellite
    - instrument
    - confidence
    - version
    - sensor
    - country
    - confidence_og_num
    - confidence_og_cat
    - dupe_flag
  # Modelo de ocurrencia de incendios (fuego / no-fuego).
  # Fire-occurrence model (fire / background) — ver
  # `src/wildfire/processing/occurrence.py`. El objetivo es un ranking de
  # riesgo (PR-AUC), no una probabilidad calibrada: la prevalencia la fija
  # el muestreo de negativos, no la naturaleza.
  occurrence:
    # Negativos por cada positivo al muestrear días de fondo (background).
    background_ratio: 2
    # Semilla del muestreo y de los splits.
    random_state: 42
    # Grupos para validación bloqueada (leave-one-group-out): por temporada
    # (año+trimestre) y por comunidad autónoma.
    cv_groups:
      - season
      - ccaa
    # Distancia máxima (km) a una detección del MISMO día por debajo de la
    # cual una fila de fondo se considera fuga de etiqueta y se rechaza.
    # Max distance (km) to a SAME-DAY detection below which a background row
    # is a label leak and is rejected by `validate_background_days`.
    leakage_max_km: 1.0
