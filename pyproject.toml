[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire"
version = "0.2.0"
description = "Wildfire dataset analysis and ML pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "rasterio",
    "geopandas",
    "shapely",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
