[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire"
version = "0.2.0"
description = "Wildfire dataset analysis and ML pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "rasterio",
    "geopandas",
    "shapely",
    "pyyaml",
    "requests",
    "requests-cache",
    "retry-requests",
    "openmeteo-requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "ipykernel",
    "nbformat",
    "nbclient",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: real network calls to Open-Meteo (excluded by default; run with -m integration)",
]
# Excluded by default: a plain `pytest tests/` never spends API quota.
# Override with `pytest -m integration` (the CLI -m wins over addopts).
addopts = "-m 'not integration'"
